  <h1 style="color: #144678; background-color: rgba(248, 248, 255, 0.5); text-align: center;">OBMC Student Enrollment Form</h1>

<h6 class="text-dark" style="text-align: center;">Fill out the form below to enroll for the upcoming school year</h6>
</div>
<br>
<div class="container">
        <div class="enrollment">
            <form>
                <h4>Student Information</h4>
                <div class="row">
                
                    <div class="col-md-6 mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" placeholder="Insert First Name...">
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" placeholder="Insert Last Name...">
                    </div>


                    <div class="col-md-4 mb-3">
                        <label class="form-label">Birth Date</label>
                        <input type="date" class="form-control">
                    </div>


                    <div class="col-md-4 mb-3">
                        <label class="form-label">Gender</label>
                        <select class="form-select">
                            <option selected disabled>Select..</option>
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>


                    <div class="col-md-4 mb-3">
                        <label class="form-label">Grade Level</label>
                        <select class="form-select">
                            <option selected disabled>Select..</option>
                            <option>Casa</option>
                            <option>Primary (Grade 1-3)</option>
                            <option>Intermidaite (Grade 4-6)</option>
                            <option>Junior High (Grade 7-10)</option>
                            <option>Senior High (11-12)</option>
                        </select>
                    </div>


                </div>


                <h4>Contact Details</h4>


                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control"
                           placeholder="student@gmail.com">
                </div>


                <div class="mb-3">
                    <label class="form-label">Contact Number</label>
                    <input type="tel" class="form-control"
                           placeholder="1234-567-8910">
                </div>




                <h4>Other Information</h4>




                <div class="mb-3">


                    <label class="form-label">Mode of Learning</label>


                    <div class="form-check">
                        <input type="radio" class="form-check-input"
                               name="learning" id="online">
                        <label class="form-check-label" for="online">Online</label>
                    </div>


                    <div class="form-check">
                        <input type="radio" class="form-check-input"
                               name="learning" id="face">
                        <label class="form-check-label" for="face">
                            Face-to-face
                        </label>
                    </div>


                </div>


                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="confirm">
                    <label class="form-check-label" for="confirm">
                        I confirm that the information provided is true and complete.
                    </label>
                </div>


                <div class="submit-btn">
                    <button type="submit" class="btn btn-lg" style="background-color: #107eeb;">
                        Submit Enrollment
                    </button>
                </div>


            </form>
</body>
